<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEUROATLAS 2.0 — интерактивный атлас мозга</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <main>
      <header><span class="eyebrow">NEUROATLAS 2.0</span><h1>Интерактивный атлас мозга</h1></header>
      <section id="brain-canvas" aria-label="Интерактивная 3D-модель мозга"></section>
      <div class="toolbar">
        <button id="reset-camera" type="button">Сбросить камеру</button>
        <button id="clear-selection" type="button">Снять выделение</button>
      </div>
      <p id="model-status" role="status" aria-live="polite">Подготовка модели…</p>
    </main>
    <aside id="structure-info">
      <h2>Анатомический атлас</h2>
      <p>Нажмите на структуру непосредственно на 3D-модели, чтобы изучить её функции.</p>
      <p class="tip">Вращение — перетаскивание мышью. Приближение — колесо мыши или жест двумя пальцами.</p>
    </aside>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
